<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders — Kitchen Gadget Shops Admin</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-logo"><i class="fa-solid fa-kitchen-set"></i> KGS Admin</div>
    <nav class="admin-nav">
      <a href="index.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="orders.html" class="active"><i class="fa-solid fa-receipt"></i> Orders</a>
      <a href="products.html"><i class="fa-solid fa-box-open"></i> Products</a>
      <a href="../index.html" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> View Store</a>
      <a href="#" onclick="adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Orders</h1>
    </div>

    <div class="admin-card">
      <div class="admin-filters">
        <input type="text" id="orderSearch" placeholder="Search by order #, name or email...">
        <select id="statusFilter">
          <option value="">All Statuses</option>
          <option>New</option>
          <option>Processing</option>
          <option>Ordered on CJ</option>
          <option>Shipped</option>
          <option>Delivered</option>
          <option>Cancelled</option>
        </select>
        <select id="cjFilter">
          <option value="">CJ: All</option>
          <option value="pending">Not Reordered on CJ</option>
          <option value="done">Reordered on CJ</option>
        </select>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>Order #</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Date</th><th>Status</th><th>CJ Reorder</th><th>Actions</th></tr>
        </thead>
        <tbody id="ordersTableBody"><tr class="empty-row"><td colspan="9">Loading orders...</td></tr></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Order Detail / CJ Reorder Modal -->
<div class="modal-overlay" id="orderModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeOrderModal()"><i class="fa-solid fa-xmark"></i></button>
    <h3>Order Details</h3>
    <div id="modalOrderContent"></div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/admin-common.js"></script>
<script src="../js/admin-orders.js"></script>
</body>
</html>
