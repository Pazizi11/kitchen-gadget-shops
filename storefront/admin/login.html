<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Kitchen Gadget Shops</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<style>
  body { background: var(--color-dark); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-card { background:#fff; border-radius:var(--radius); padding:40px; width:100%; max-width:380px; box-shadow: var(--shadow-lg); }
  .login-card .logo-icon { margin: 0 auto 16px; }
  .login-card h1 { text-align:center; font-size:1.4rem; margin-bottom:6px; }
  .login-card p.sub { text-align:center; color:var(--color-muted); font-size:0.88rem; margin-bottom:28px; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo-icon" style="width:56px;height:56px;border-radius:14px;font-size:1.6rem;">
      <i class="fa-solid fa-kitchen-set"></i>
    </div>
    <h1>Store Admin</h1>
    <p class="sub">Kitchen Gadget Shops dashboard access</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="adminEmail" placeholder="Admin email" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-lock-open"></i> Sign In</button>
      <p id="loginError" style="color:var(--color-danger); font-size:0.85rem; margin-top:14px; display:none; text-align:center;">Unable to sign in. Check your details or make sure the backend is running.</p>
    </form>
    <p style="text-align:center; margin-top:24px;"><a href="../index.html" style="font-size:0.85rem; color:var(--color-muted);"><i class="fa-solid fa-arrow-left"></i> Back to store</a></p>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const error = document.getElementById('loginError');
      error.style.display = 'none';
      try {
        const result = await apiFetchPath('auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('adminEmail').value.trim(),
            password: document.getElementById('adminPassword').value
          })
        });
        if (!result || !result.token) throw new Error('No auth token');
        sessionStorage.setItem('kgs_admin_token', result.token);
        window.location.href = 'index.html';
      } catch (err) {
        error.style.display = 'block';
      }
    });
  </script>
</body>
</html>
